<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <link rel="stylesheet" href="login.css" />
    <!-- poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@400..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="ellipse1"></div>
    <div class="ellipse2"></div>
    <div class="ellipse3"></div>
    <div class="ellipse4"></div>
    <div class="ellipse5"></div>

    <div class="circle-group">
      <div class="circle big">
        <div class="circle medium">
          <div class="circle small"></div>
        </div>
      </div>
    </div>

    <div class="container">
      <div class="box">
        <div class="wrapper">
          <!-- LOGIN -->
          <form class="form login-form">
            <h1>Login</h1>

            <div class="input-box">
              <input type="email" placeholder=" " required />
              <label>Email</label>
            </div>

            <div class="input-box">
              <input type="password" placeholder=" " required />
              <label>Password</label>
            </div>

            <button type="submit" class="btn">
              <span>Login</span>
            </button>

            <div class="links">
              <button class="create">Create an account</button>
              <button class="forgot">Forgot password?</button>
            </div>
          </form>
          <!-- SIGN UP -->
          <form class="form signup-form">
            <h1>Sign Up</h1>

            <div class="input-box">
              <input type="email" placeholder=" " required />
              <label>Email</label>
            </div>

            <div class="input-box">
              <input type="password" placeholder=" " required />
              <label>Password</label>
            </div>

            <div class="input-box">
              <input type="password" placeholder=" " required />
              <label>Confirm Password</label>
            </div>

            <button type="submit" class="btn">
              <span>Sign Up</span>
            </button>

            <div class="links">
              <button type="button" class="back">
                Already have an account
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script src="login.js"></script>
  </body>
</html>
